name: Publication safety gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
      - name: Test guard against unsafe fixtures
        run: python3 scripts/check_publication.py --self-test
      - name: Block restricted files and unpinned Actions
        run: python3 scripts/check_publication.py
